<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5F7A55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Planner">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Meal Planner</title>
<style>
  :root{
    --paper:#F6F2E9;
    --card:#FFFDF7;
    --ink:#2E2A24;
    --ink-soft:#6B6558;
    --ink-faint:#9C9587;
    --line:#DED6C4;
    --sage:#5F7A55;
    --sage-deep:#3E5236;
    --sage-wash:#E7EEE1;
    --mustard:#B9822E;
    --mustard-wash:#F5E8D3;
    --clay:#B9583A;
    --clay-wash:#F5E1D8;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:20px 16px 60px;
    max-width:640px;
    margin:0 auto;
  }
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    color:var(--ink);
  }
  .app-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:20px;
  }
  .header-menu{position:relative;flex-shrink:0;margin-top:2px;}
  .header-menu-btn{
    width:36px;
    height:36px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--card);
    color:var(--ink-soft);
    font-size:18px;
    line-height:1;
    cursor:pointer;
  }
  .header-menu-btn:hover{border-color:var(--sage);}
  .header-menu-panel{
    display:none;
    position:absolute;
    right:0;
    top:44px;
    width:230px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    z-index:30;
  }
  .header-menu-panel.open{display:block;}
  .tabs{
    display:flex;
    gap:4px;
    border-bottom:1px solid var(--line);
    margin-bottom:20px;
  }
  .tab{
    font-family:Georgia,serif;
    font-size:15px;
    padding:9px 14px;
    background:none;
    border:none;
    color:var(--ink-faint);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{
    color:var(--sage-deep);
    border-bottom:2px solid var(--sage);
    font-weight:600;
  }
  .panel{display:none;}
  .panel.active{display:block;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
  }
  .meal-title-row{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px 10px;
    margin:0 0 4px;
  }
  .meal-name{
    font-family:Georgia,serif;
    font-size:17px;
    font-weight:600;
    flex:1 1 0%;
    min-width:120px;
  }
  .meal-parts{
    font-size:14px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .meal-meta{
    font-size:12px;
    color:var(--ink-faint);
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
  }
  .meal-icon-actions{display:flex;gap:6px;}
  .made-today-btn{flex:1;text-align:center;margin-top:0;}
  .pill{
    display:inline-block;
    font-size:12px;
    padding:2px 9px;
    border-radius:999px;
    background:var(--sage-wash);
    color:var(--sage-deep);
    flex-shrink:0;
  }
  .pill.stale{background:var(--mustard-wash);color:var(--mustard);}
  .row{display:flex;gap:8px;align-items:center;}
  .row-actions{display:flex;gap:6px;}
  button.icon-btn{
    background:none;border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;font-size:13px;color:var(--ink-soft);cursor:pointer;
  }
  button.icon-btn:active{transform:scale(0.97);}
  .meal-actions-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
  }
  .icon-only-btn{
    width:40px;
    height:40px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line);
    border-radius:8px;
    background:none;
    color:var(--ink-soft);
    cursor:pointer;
    padding:0;
  }
  .icon-only-btn:hover{border-color:var(--sage);color:var(--sage-deep);}
  .icon-only-btn.danger:hover{border-color:var(--clay);color:var(--clay);}
  .icon-only-btn:active{transform:scale(0.95);}
  .icon-only-btn svg{width:18px;height:18px;display:block;}
  .btn-primary{
    background:var(--sage);color:#fff;border:none;border-radius:8px;
    padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-ghost{
    background:none;border:1px dashed var(--line);border-radius:8px;
    padding:10px 16px;font-size:14px;color:var(--ink-soft);cursor:pointer;
    width:100%;
  }
  input[type=text], input[type=date], textarea, select{
    width:100%;
    font-size:15px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    margin-bottom:10px;
  }
  label.field-label{
    font-size:12px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:4px;
  }
  .form-wrap{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
  }
  .day-block{
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .day-block:last-child{border-bottom:none;}
  .day-heading{
    font-family:Georgia,serif;
    font-size:15px;
    font-weight:600;
    margin:0 0 8px;
    color:var(--ink);
  }
  .day-heading-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 0 8px;
  }
  .day-heading-row .day-heading{margin:0;}
  .mark-made-btn{width:32px;height:32px;flex-shrink:0;}
  .mark-made-btn svg{width:16px;height:16px;}
  .mark-made-panel{
    padding:12px;
    margin-top:8px;
  }
  .mark-made-panel-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .slot-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:5px 0;
  }
  .day-label{
    width:76px;
    flex-shrink:0;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .day-select{margin-bottom:0;}
  .multiselect{position:relative;}
  .multiselect-control{
    width:100%;
    min-height:38px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    padding:8px 32px 8px 10px;
    cursor:pointer;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
  }
  .multiselect-control:hover{border-color:var(--sage);}
  .multiselect-placeholder{
    font-size:15px;
    color:var(--ink-faint);
  }
  .multiselect-selected-item{
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    font-weight:600;
    color:var(--sage-deep);
    background:var(--sage-wash);
    border-radius:999px;
    padding:4px 8px 4px 12px;
    line-height:1.3;
  }
  .multiselect-pill-remove{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:16px;
    height:16px;
    border-radius:50%;
    font-size:11px;
    color:var(--sage-deep);
    opacity:0.65;
    cursor:pointer;
  }
  .multiselect-pill-remove:hover{opacity:1;background:rgba(0,0,0,0.06);}
  .multiselect-clear-day{
    position:absolute;
    right:10px;
    top:9px;
    width:20px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:13px;
    color:var(--ink-faint);
    cursor:pointer;
  }
  .multiselect-clear-day:hover{color:var(--clay);background:rgba(0,0,0,0.05);}
  .multiselect-panel{
    position:relative;
    margin-top:4px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    overflow:hidden;
  }
  .day-picker{
    margin-top:10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    overflow:hidden;
  }
  .day-picker-title{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    padding:9px 10px;
    border-bottom:1px solid var(--line);
  }
  .multiselect-search-wrap{
    padding:8px;
    border-bottom:1px solid var(--line);
  }
  input.multiselect-search{
    width:100%;
    margin:0;
    padding:7px 9px;
    font-size:14px;
    border:1px solid var(--line);
    border-radius:6px;
  }
  .multiselect-no-match{
    padding:12px 10px;
    font-size:13px;
    color:var(--ink-faint);
  }
  .multiselect-option{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    font-size:14px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .multiselect-option:last-child{border-bottom:none;}
  .multiselect-option input{
    width:auto;
    margin:0;
  }
  .empty{
    text-align:center;
    color:var(--ink-faint);
    font-size:14px;
    padding:30px 10px;
  }
  .shop-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:15px;
  }
  .shop-item:last-child{border-bottom:none;}
  .shop-item.checked span{
    text-decoration:line-through;
    color:var(--ink-faint);
  }
  .shop-item.dragging{
    position:relative;
    z-index:50;
    background:var(--card);
    box-shadow:0 6px 16px rgba(0,0,0,0.14);
    border-radius:8px;
  }
  .shop-item.shift-anim{
    transition:transform 150ms ease;
  }
  .drag-handle{
    display:flex;
    align-items:center;
    flex-shrink:0;
    color:var(--ink-faint);
    cursor:grab;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .drag-handle:active{cursor:grabbing;}
  .shop-item.dragging .drag-handle{cursor:grabbing;color:var(--sage-deep);}
  .shop-source{
    font-size:12px;
    color:var(--ink-faint);
    margin-left:auto;
  }
  .section-title{
    font-family:Georgia,serif;
    font-size:15px;
    font-weight:600;
    margin:20px 0 8px;
    color:var(--ink);
  }
  .top-actions{
    display:flex;
    justify-content:flex-end;
    margin-bottom:14px;
  }
  .hint{font-size:13px;color:var(--ink-soft);margin:0 0 14px;}
  .close-form{
    display:flex;justify-content:flex-end;margin-top:4px;
  }
  .link-btn{
    background:none;border:none;color:var(--ink-faint);font-size:13px;
    cursor:pointer;text-decoration:underline;padding:0;
  }
  .toast-container{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    width:calc(100% - 32px);
    max-width:420px;
    pointer-events:none;
  }
  .toast{
    width:100%;
    box-sizing:border-box;
    padding:11px 16px;
    border-radius:10px;
    font-size:14px;
    box-shadow:0 6px 18px rgba(0,0,0,0.18);
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink);
    opacity:0;
    transform:translateY(8px);
    transition:opacity 200ms ease, transform 200ms ease;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast.success{background:var(--sage-wash);border-color:var(--sage);color:var(--sage-deep);}
  .toast.error{background:var(--clay-wash);border-color:var(--clay);color:var(--clay);}
</style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<div class="app-header">
  <h1>Meal Planner</h1>
  <div class="header-menu">
    <button class="header-menu-btn" onclick="toggleHeaderMenu(event)" aria-label="Backup menu">⋯</button>
    <div id="header-menu-panel" class="header-menu-panel">
      <div id="backup-menu-content"></div>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="week">This week</button>
  <button class="tab" data-tab="shop">Shopping list</button>
  <button class="tab" data-tab="meals">My meals</button>
</div>

<div id="panel-week" class="panel active">
  <div class="card" id="week-card"></div>
  <div class="top-actions" style="margin-top:14px;">
    <button class="icon-btn" id="clear-week">Clear all days</button>
  </div>
</div>

<div id="panel-shop" class="panel">
  <div class="section-title" style="margin-top:0;">Add something else</div>
  <div class="row" style="margin-bottom:16px;">
    <input type="text" id="extra-item" placeholder="e.g. paper towels" style="margin-bottom:0;">
    <button class="icon-btn" id="add-extra">Add</button>
  </div>
  <div class="card" id="shop-list"></div>
</div>

<div id="panel-meals" class="panel">
  <div class="top-actions" style="justify-content:space-between;align-items:center;">
    <div class="row" id="sort-row" style="gap:8px;">
      <label class="field-label" for="meal-sort" style="margin:0;">Sort by</label>
      <select id="meal-sort" style="width:auto;margin-bottom:0;font-size:13px;padding:6px 10px;">
        <option value="due">Due for a repeat</option>
        <option value="recent">Recently made</option>
        <option value="name">Name (A–Z)</option>
        <option value="added">Recently added</option>
      </select>
    </div>
    <button class="btn-primary" id="show-add-form">Add a meal</button>
  </div>
  <div id="add-form-wrap"></div>
  <div id="meals-list"></div>
</div>

<script>
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
let meals = [];
let week = {};
let openDropdownDay = null;
let daySearch = {};
let shopExtras = [];
let shopChecked = {};
let shopOrder = [];
let editingId = null;
let mealSort = localStorage.getItem('mealRotation.mealSort') || 'due';
let openMealDayPicker = null;
let confirmDeleteId = null;
let openMarkMadeDay = null;
let markMadeDateOverride = {};

const MEAL_COLORS = [
  { bg:'#E7EEE1', fg:'#3E5236' }, // sage
  { bg:'#F5E1D8', fg:'#B9583A' }, // clay
  { bg:'#F5E8D3', fg:'#B9822E' }, // mustard
  { bg:'#E3EAF2', fg:'#33587A' }, // blue
  { bg:'#EDE3F2', fg:'#6B3F8C' }, // plum
  { bg:'#F2E3E9', fg:'#8C3F5F' }, // berry
  { bg:'#E3F0EC', fg:'#2F7A63' }, // teal
  { bg:'#F2ECE3', fg:'#8C6B3F' }, // tan
  { bg:'#EDF0D6', fg:'#74842E' }, // olive
  { bg:'#E2E4F5', fg:'#4A4A9E' }, // indigo
  { bg:'#F7E3ED', fg:'#A13F72' }, // rose
  { bg:'#E6EAEC', fg:'#4C6270' }, // slate
];

// Colors are assigned by order of first appearance among meals currently
// selected somewhere in the week, so pills stay consistent with each other
// while the week is populated but can shift once everything is cleared and
// re-picked later.
function assignWeekMealColors(){
  const colorMap = {};
  let next = 0;
  DAYS.forEach(d=>{
    (week[d]||[]).forEach(id=>{
      if(!(id in colorMap)){
        colorMap[id] = MEAL_COLORS[next % MEAL_COLORS.length];
        next++;
      }
    });
  });
  return colorMap;
}

function uid(){ return 'm_' + Math.random().toString(36).slice(2,9); }

const STORAGE_PREFIX = 'mealRotation.';

function loadAll(){
  try{ meals = JSON.parse(localStorage.getItem(STORAGE_PREFIX+'meals')) || []; }
  catch(e){ meals = []; }
  try{ week = JSON.parse(localStorage.getItem(STORAGE_PREFIX+'week')) || {}; }
  catch(e){ week = {}; }
  // normalize week[day] to an array
  Object.keys(week).forEach(d=>{
    if(!Array.isArray(week[d])){
      week[d] = Object.values(week[d]).filter(Boolean);
    }
  });
  try{
    const rawExtras = JSON.parse(localStorage.getItem(STORAGE_PREFIX+'shopExtras')) || [];
    shopExtras = rawExtras.map(x => typeof x === 'string' ? { id: uid(), label: x } : x);
  }catch(e){ shopExtras = []; }
  try{ shopChecked = JSON.parse(localStorage.getItem(STORAGE_PREFIX+'shopChecked')) || {}; }
  catch(e){ shopChecked = {}; }
  try{ shopOrder = JSON.parse(localStorage.getItem(STORAGE_PREFIX+'shopOrder')) || []; }
  catch(e){ shopOrder = []; }
  renderMeals();
  renderWeek();
  renderShop();
}

function saveMeals(){
  localStorage.setItem(STORAGE_PREFIX+'meals', JSON.stringify(meals));
}
function saveWeek(){
  localStorage.setItem(STORAGE_PREFIX+'week', JSON.stringify(week));
}
function saveShopExtras(){
  localStorage.setItem(STORAGE_PREFIX+'shopExtras', JSON.stringify(shopExtras));
}
function saveShopChecked(){
  localStorage.setItem(STORAGE_PREFIX+'shopChecked', JSON.stringify(shopChecked));
}
function saveShopOrder(){
  localStorage.setItem(STORAGE_PREFIX+'shopOrder', JSON.stringify(shopOrder));
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('panel-'+t.dataset.tab).classList.add('active');
    if(t.dataset.tab==='shop') renderShop();
    if(t.dataset.tab==='week') renderWeek();
  });
});

const ICON_CALENDAR_PLUS = '<svg viewBox="0 0 448 512"><path fill="currentColor" d="M128 0c17.7 0 32 14.3 32 32l0 32 128 0 0-32c0-17.7 14.3-32 32-32s32 14.3 32 32l0 32 32 0c35.3 0 64 28.7 64 64l0 288c0 35.3-28.7 64-64 64L64 480c-35.3 0-64-28.7-64-64L0 128C0 92.7 28.7 64 64 64l32 0 0-32c0-17.7 14.3-32 32-32zm96 192c-13.3 0-24 10.7-24 24l0 48-48 0c-13.3 0-24 10.7-24 24s10.7 24 24 24l48 0 0 48c0 13.3 10.7 24 24 24s24-10.7 24-24l0-48 48 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-48 0 0-48c0-13.3-10.7-24-24-24z"/></svg>';
const ICON_PEN = '<svg viewBox="0 0 512 512"><path fill="currentColor" d="M471.6 21.7c-21.9-21.9-57.3-21.9-79.2 0L368 46.1 465.9 144 490.3 119.6c21.9-21.9 21.9-57.3 0-79.2L471.6 21.7zm-299.2 220c-6.1 6.1-10.8 13.6-13.5 21.9l-29.6 88.8c-2.9 8.6-.6 18.1 5.8 24.6s15.9 8.7 24.6 5.8l88.8-29.6c8.2-2.7 15.7-7.4 21.9-13.5L432 177.9 334.1 80 172.4 241.7zM96 64C43 64 0 107 0 160L0 416c0 53 43 96 96 96l256 0c53 0 96-43 96-96l0-96c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 96c0 17.7-14.3 32-32 32L96 448c-17.7 0-32-14.3-32-32l0-256c0-17.7 14.3-32 32-32l96 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L96 64z"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 448 512"><path fill="currentColor" d="M136.7 5.9L128 32 32 32C14.3 32 0 46.3 0 64S14.3 96 32 96l384 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0-8.7-26.1C306.9-7.2 294.7-16 280.9-16L167.1-16c-13.8 0-26 8.8-30.4 21.9zM416 144L32 144 53.1 467.1C54.7 492.4 75.7 512 101 512L347 512c25.3 0 46.3-19.6 47.9-44.9L416 144z"/></svg>';
const ICON_GRIP = '<svg viewBox="0 0 16 16" width="14" height="14"><circle cx="5" cy="3" r="1.3" fill="currentColor"/><circle cx="11" cy="3" r="1.3" fill="currentColor"/><circle cx="5" cy="8" r="1.3" fill="currentColor"/><circle cx="11" cy="8" r="1.3" fill="currentColor"/><circle cx="5" cy="13" r="1.3" fill="currentColor"/><circle cx="11" cy="13" r="1.3" fill="currentColor"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 512 512"><path fill="currentColor" d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM369 209L241 337c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L335 175c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z"/></svg>';

function daysAgo(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / (1000*60*60*24));
}

const DOW = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};

// Most recent date (today or earlier) that falls on the given weekday.
function mostRecentDateForDay(dayAbbrev, base){
  base = base || new Date();
  const diff = (base.getDay() - DOW[dayAbbrev] + 7) % 7;
  const d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  d.setDate(d.getDate() - diff);
  return d;
}

function toDateInputValue(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function defaultMarkMadeDate(day){
  return toDateInputValue(mostRecentDateForDay(day));
}

function renderMeals(){
  const list = document.getElementById('meals-list');
  const sortRow = document.getElementById('sort-row');
  if(meals.length===0){
    list.innerHTML = '<div class="empty">No meals saved yet</div>';
    if(sortRow) sortRow.style.display = 'none';
    return;
  }
  if(sortRow) sortRow.style.display = 'flex';
  const sorted = [...meals].sort((a,b)=>{
    if(mealSort==='name'){
      return a.name.localeCompare(b.name);
    }
    if(mealSort==='added'){
      const ca = a.createdAt ? new Date(a.createdAt) : new Date(0);
      const cb = b.createdAt ? new Date(b.createdAt) : new Date(0);
      return cb - ca;
    }
    const da = a.lastMade ? new Date(a.lastMade) : new Date(0);
    const db = b.lastMade ? new Date(b.lastMade) : new Date(0);
    if(mealSort==='recent') return db - da;
    return da - db; // 'due' (default): oldest / never made first
  });
  list.innerHTML = sorted.map(m=>{
    const ago = daysAgo(m.lastMade);
    let metaText, metaClass = '';
    if(ago===null){ metaText = 'not marked yet'; }
    else if(ago===0){ metaText = 'made today'; metaClass='stale'; }
    else if(ago<=3){ metaText = 'made ' + ago + 'd ago'; metaClass='stale'; }
    else { metaText = 'made ' + ago + 'd ago'; }
    const assignedDays = DAYS.filter(d=>(week[d]||[]).includes(m.id));
    const pickerOpen = openMealDayPicker === m.id;
    const confirmingDelete = confirmDeleteId === m.id;
    const isEditing = editingId === m.id;
    return `
    <div class="card">
      <div class="meal-title-row">
        <span class="meal-name">${escapeHtml(m.name)}</span>
        <span class="pill ${metaClass}">${metaText}</span>
      </div>
      ${m.parts ? `<div class="meal-parts">${escapeHtml(m.parts)}</div>` : ''}
      ${assignedDays.length>0 ? `<div class="meal-parts">This week: ${assignedDays.join(', ')}</div>` : ''}
      ${confirmingDelete ? `
        <div class="day-picker" style="padding:12px 10px;margin-top:10px;">
          <div style="font-size:14px;color:var(--ink);margin-bottom:10px;">Delete "${escapeHtml(m.name)}"? This can't be undone.</div>
          <div class="row" style="justify-content:flex-end;gap:8px;">
            <button class="link-btn" onclick="cancelDeleteMeal()">Cancel</button>
            <button class="icon-btn danger" style="border-color:var(--clay);color:var(--clay);" onclick="deleteMeal('${m.id}')">Delete meal</button>
          </div>
        </div>
      ` : isEditing ? mealEditFormHtml(m) : `
        <div class="meal-actions-row">
          <button class="icon-btn made-today-btn" onclick="markMade('${m.id}')">Made this today</button>
          <button class="icon-only-btn day-picker-btn" onclick="toggleMealDayPicker(event,'${m.id}')" title="Add to week">${ICON_CALENDAR_PLUS}</button>
          <button class="icon-only-btn" onclick="editMeal('${m.id}')" title="Edit">${ICON_PEN}</button>
          <button class="icon-only-btn danger" onclick="askDeleteMeal('${m.id}')" title="Delete">${ICON_TRASH}</button>
        </div>
      `}
      ${pickerOpen ? `
        <div class="day-picker">
          <div class="day-picker-title">Add "${escapeHtml(m.name)}" to:</div>
          ${DAYS.map(d=>`
            <label class="multiselect-option">
              <input type="checkbox" ${(week[d]||[]).includes(m.id)?'checked':''} onchange="toggleDayMeal('${d}','${m.id}')">
              <span>${d}</span>
            </label>
          `).join('')}
        </div>
      ` : ''}
    </div>`;
  }).join('');
}

function mealEditFormHtml(m){
  return `
    <div class="form-wrap" style="margin:10px 0 0;padding:0;background:none;border:none;">
      <label class="field-label">Meal name</label>
      <input type="text" id="f-name-${m.id}" value="${escapeHtml(m.name)}">
      <label class="field-label">Parts (optional — base, main, side)</label>
      <input type="text" id="f-parts-${m.id}" value="${escapeHtml(m.parts||'')}">
      <label class="field-label">Items to have on hand (comma separated)</label>
      <textarea id="f-items-${m.id}" rows="2">${escapeHtml((m.items||[]).join(', '))}</textarea>
      <div class="row" style="justify-content:flex-end;gap:8px;">
        <button class="link-btn" onclick="cancelMealEdit()">Cancel</button>
        <button class="btn-primary" onclick="saveMealEdit('${m.id}')">Save changes</button>
      </div>
    </div>
  `;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

window.markMade = async function(id){
  const m = meals.find(x=>x.id===id);
  if(m){ m.lastMade = new Date().toISOString(); await saveMeals(); renderMeals(); }
}

window.askDeleteMeal = function(id){
  confirmDeleteId = id;
  openMealDayPicker = null;
  editingId = null;
  renderMeals();
}

window.cancelDeleteMeal = function(){
  confirmDeleteId = null;
  renderMeals();
}

window.deleteMeal = async function(id){
  meals = meals.filter(x=>x.id!==id);
  Object.keys(week).forEach(d=>{
    week[d] = week[d].filter(mealId=>mealId!==id);
    if(week[d].length===0) delete week[d];
  });
  if(openMealDayPicker===id) openMealDayPicker = null;
  if(confirmDeleteId===id) confirmDeleteId = null;
  if(editingId===id) editingId = null;
  await saveMeals();
  await saveWeek();
  renderMeals();
  renderWeek();
}

window.editMeal = function(id){
  editingId = id;
  confirmDeleteId = null;
  openMealDayPicker = null;
  document.getElementById('add-form-wrap').innerHTML = '';
  renderMeals();
}

window.cancelMealEdit = function(){
  editingId = null;
  renderMeals();
}

window.saveMealEdit = async function(id){
  const nameInput = document.getElementById('f-name-'+id);
  const name = nameInput.value.trim();
  if(!name){
    nameInput.style.borderColor = '#B9583A';
    return;
  }
  const parts = document.getElementById('f-parts-'+id).value.trim();
  const items = document.getElementById('f-items-'+id).value.split(',').map(s=>s.trim()).filter(Boolean);
  const existing = meals.find(x=>x.id===id);
  existing.name = name; existing.parts = parts; existing.items = items;
  await saveMeals();
  editingId = null;
  renderMeals();
}

  wrap.innerHTML = `
    <div class="form-wrap">

      <input type="text" id="f-name">
      <label class="field-label">Parts (optional — base, main, side)</label>

        <button class="btn-primary" id="f-save">Save meal</button>
      </div>
    </div>
  `;
  document.getElementById('f-cancel').addEventListener('click', ()=>{ wrap.innerHTML=''; });
  document.getElementById('f-save').addEventListener('click', async ()=>{

    const errBox = document.getElementById('f-name');
    if(!name){
      errBox.style.borderColor = '#B9583A';
      return;
    }
    const parts = document.getElementById('f-parts').value.trim();
    const items = document.getElementById('f-items').value.split(',').map(s=>s.trim()).filter(Boolean);

    await saveMeals();
    wrap.innerHTML = '';
    renderMeals();
  });
}

function renderWeek(){
  const card = document.getElementById('week-card');
  if(meals.length===0){
    card.innerHTML = '<div class="empty">Add some meals first, then come back to plan the week.</div>';
    return;
  }
  const weekColors = assignWeekMealColors();
  card.innerHTML = DAYS.map(d=>{
    const selectedIds = week[d] || [];
    const selectedMeals = selectedIds.map(id=>meals.find(m=>m.id===id)).filter(Boolean);
    const isOpen = openDropdownDay === d;
    const query = (daySearch[d]||'').trim().toLowerCase();
    const visibleMeals = query ? meals.filter(m=>m.name.toLowerCase().includes(query)) : meals;
    const markMadeOpen = openMarkMadeDay === d && selectedMeals.length>0;
    const markMadeDate = markMadeDateOverride[d] || defaultMarkMadeDate(d);
    return `
      <div class="day-block">
        <div class="day-heading-row">
          <div class="day-heading">${d}</div>
          ${selectedMeals.length>0 ? `<button class="icon-only-btn mark-made-btn" onclick="toggleMarkMadeDay(event,'${d}')" title="Mark all of ${d}'s meals made">${ICON_CHECK}</button>` : ''}
        </div>
        <div class="multiselect">
          <div class="multiselect-control" onclick="toggleDropdown('${d}')">
            ${selectedMeals.length===0
              ? '<span class="multiselect-placeholder">— not planned —</span>'
              : selectedMeals.map(m=>{
                  const c = weekColors[m.id];
                  return `
                  <span class="multiselect-selected-item" style="background:${c.bg};color:${c.fg};">
                    ${escapeHtml(m.name)}
                    <span class="multiselect-pill-remove" style="color:${c.fg};" onclick="removeMealFromDay(event,'${d}','${m.id}')">✕</span>
                  </span>
                `;}).join('')}
            ${selectedMeals.length>0 ? `<span class="multiselect-clear-day" onclick="clearDay(event,'${d}')" title="Clear ${d}">✕</span>` : ''}
          </div>
          ${isOpen ? `
            <div class="multiselect-panel">
              <div class="multiselect-search-wrap">
                <input type="text" class="multiselect-search" data-day="${d}" placeholder="Search meals"
                  value="${escapeHtml(daySearch[d]||'')}" oninput="setDaySearch('${d}', this.value)">
              </div>
              ${visibleMeals.length===0
                ? '<div class="multiselect-no-match">No meals match.</div>'
                : visibleMeals.map(m=>`
                  <label class="multiselect-option">
                    <input type="checkbox" ${selectedIds.includes(m.id)?'checked':''} onchange="toggleDayMeal('${d}','${m.id}')">
                    <span>${escapeHtml(m.name)}</span>
                  </label>
                `).join('')}
            </div>
          ` : ''}
        </div>
        ${markMadeOpen ? `
          <div class="day-picker mark-made-panel">
            <div class="mark-made-panel-label">Mark ${selectedMeals.map(m=>escapeHtml(m.name)).join(', ')} made on:</div>
            <input type="date" value="${markMadeDate}" onclick="event.stopPropagation()" oninput="setMarkMadeDate('${d}', this.value)">
            <div class="row" style="justify-content:flex-end;gap:8px;">
              <button class="link-btn" onclick="cancelMarkMadeDay(event)">Cancel</button>
              <button class="btn-primary" onclick="confirmMarkMade(event,'${d}')">Mark all made</button>
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
  if(openDropdownDay){
    const inp = card.querySelector(`.multiselect-search[data-day="${openDropdownDay}"]`);
    if(inp){
      inp.focus();
      const v = inp.value;
      inp.setSelectionRange(v.length, v.length);
    }
  }
}

window.toggleDropdown = function(day){
  openDropdownDay = (openDropdownDay===day) ? null : day;
  renderWeek();
}

window.setDaySearch = function(day, value){
  daySearch[day] = value;
  renderWeek();
}

window.toggleDayMeal = async function(day, mealId){
  if(!week[day]) week[day] = [];
  const idx = week[day].indexOf(mealId);
  if(idx>=0) week[day].splice(idx,1); else week[day].push(mealId);
  if(week[day].length===0) delete week[day];
  await saveWeek();
  renderShop();
  renderWeek();
  renderMeals();
}

window.toggleMealDayPicker = function(event, mealId){
  event.stopPropagation();
  openMealDayPicker = (openMealDayPicker===mealId) ? null : mealId;
  renderMeals();
}

window.removeMealFromDay = async function(event, day, mealId){
  event.stopPropagation();
  if(!week[day]) return;
  week[day] = week[day].filter(id=>id!==mealId);
  if(week[day].length===0) delete week[day];
  await saveWeek();
  renderShop();
  renderWeek();
}

window.clearDay = async function(event, day){
  event.stopPropagation();
  delete week[day];
  delete daySearch[day];
  await saveWeek();
  renderShop();
  renderWeek();
}

window.toggleMarkMadeDay = function(event, day){
  event.stopPropagation();
  openMarkMadeDay = (openMarkMadeDay===day) ? null : day;
  renderWeek();
}

window.setMarkMadeDate = function(day, value){
  markMadeDateOverride[day] = value;
}

window.cancelMarkMadeDay = function(event){
  event.stopPropagation();
  openMarkMadeDay = null;
  renderWeek();
}

window.confirmMarkMade = async function(event, day){
  event.stopPropagation();
  const dateVal = markMadeDateOverride[day] || defaultMarkMadeDate(day);
  const lastMade = new Date(dateVal+'T00:00:00').toISOString();
  (week[day]||[]).forEach(id=>{
    const m = meals.find(x=>x.id===id);
    if(m) m.lastMade = lastMade;
  });
  delete week[day];
  delete markMadeDateOverride[day];
  openMarkMadeDay = null;
  await saveMeals();
  await saveWeek();
  renderWeek();
  renderMeals();
  renderShop();
}

function capitalizeFirst(s){
  if(!s) return s;
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function renderShop(){
  const box = document.getElementById('shop-list');
  const allIds = [];
  Object.values(week).forEach(daySlots=>{
    Object.values(daySlots).forEach(id=>allIds.push(id));
  });
  const mealIds = [...new Set(allIds)];
  const grouped = {};
  mealIds.forEach(id=>{
    const m = meals.find(x=>x.id===id);
    if(!m) return;
    (m.items||[]).forEach(item=>{
      const key = item.toLowerCase();
      if(!grouped[key]) grouped[key] = { label: item, sources: [] };
      grouped[key].sources.push(m.name);
    });
  });

  const rowsById = {};
  Object.keys(grouped).forEach(key=>{
    const id = 'g_'+key;
    rowsById[id] = { id, label: capitalizeFirst(grouped[key].label), source: grouped[key].sources.join(', '), manual:false };
  });
  shopExtras.forEach(ex=>{
    const id = 'x_'+ex.id;
    rowsById[id] = { id, label: ex.label, source: 'added by you', manual:true };
  });

  // Reconcile persisted order with current rows: drop stale ids, place new ones
  // (manual items go to the top, auto/meal-derived items go to the bottom).
  const validIds = new Set(Object.keys(rowsById));
  const existingIds = new Set(shopOrder);
  let orderChanged = false;
  shopOrder = shopOrder.filter(id=>{
    const keep = validIds.has(id);
    if(!keep) orderChanged = true;
    return keep;
  });
  Object.keys(rowsById).forEach(id=>{
    if(!existingIds.has(id)){
      orderChanged = true;
      if(rowsById[id].manual) shopOrder.unshift(id);
      else shopOrder.push(id);
    }
  });
  if(orderChanged) saveShopOrder();

  if(Object.keys(rowsById).length===0){
    box.innerHTML = '<div class="empty">Plan some meals for the week to build your list, or add items below.</div>';
    return;
  }

  const unchecked = shopOrder.filter(id=>!shopChecked[id]);
  const checked = shopOrder.filter(id=>shopChecked[id]);
  const orderedIds = [...unchecked, ...checked];

  box.innerHTML = orderedIds.map(id=>{
    const r = rowsById[id];
    const isChecked = !!shopChecked[id];
    return `
    <div class="shop-item ${isChecked?'checked':''}" data-id="${encodeURIComponent(id)}" data-checked="${isChecked?'1':'0'}">
      <span class="drag-handle" title="Drag to reorder">${ICON_GRIP}</span>
      <input type="checkbox" ${isChecked?'checked':''} onchange="toggleCheck('${id}')">
      <span>${escapeHtml(r.label)}</span>
      <span class="shop-source">${escapeHtml(r.source)}</span>
    </div>`;
  }).join('');

  attachShopDragHandlers();
}

window.toggleCheck = async function(id){
  shopChecked[id] = !shopChecked[id];
  await saveShopChecked();
  renderShop();
}

function attachShopDragHandlers(){
  document.querySelectorAll('#shop-list .shop-item').forEach(rowEl=>{
    const handle = rowEl.querySelector('.drag-handle');
    if(handle) handle.onpointerdown = (e)=> beginShopDrag(e, rowEl);
  });
}

function beginShopDrag(e, rowEl){
  e.preventDefault();
  const container = rowEl.parentElement;
  const groupAttr = rowEl.dataset.checked;
  // Siblings and their rects are captured once, up front, and never touched
  // again until drop. During the drag we only ever apply CSS transforms
  // (dragged row tracks the pointer, displaced rows slide by one row-height)
  // — nothing reflows mid-drag, so there's nothing for the maths to drift
  // against. The DOM is only actually reordered once, on release.
  const siblings = Array.from(container.querySelectorAll('.shop-item')).filter(el=>el.dataset.checked===groupAttr);
  const draggedIndex = siblings.indexOf(rowEl);
  const rects = new Map(siblings.map(el=>[el, el.getBoundingClientRect()]));
  const draggedHeight = rects.get(rowEl).height;
  const afterEl = siblings[siblings.length-1].nextElementSibling;
  const startY = e.clientY;
  const pointerId = e.pointerId;
  rowEl.classList.add('dragging');
  siblings.forEach(el=>{ if(el!==rowEl) el.classList.add('shift-anim'); });
  try{ rowEl.setPointerCapture(pointerId); }catch(err){}

  let latestOrder = siblings.slice();

  function onMove(ev){
    const dy = ev.clientY - startY;
    rowEl.style.transform = `translateY(${dy}px)`;
    const draggedCenter = rects.get(rowEl).top + dy + draggedHeight/2;

    const aboveStay = [], aboveMoved = [], belowMoved = [], belowStay = [];
    siblings.forEach((sib, idx)=>{
      if(sib===rowEl) return;
      const r = rects.get(sib);
      const sibCenter = r.top + r.height/2;
      if(idx < draggedIndex){
        const displaced = draggedCenter < sibCenter;
        sib.style.transform = displaced ? `translateY(${draggedHeight}px)` : '';
        (displaced ? aboveMoved : aboveStay).push(sib);
      } else {
        const displaced = draggedCenter > sibCenter;
        sib.style.transform = displaced ? `translateY(${-draggedHeight}px)` : '';
        (displaced ? belowMoved : belowStay).push(sib);
      }
    });
    latestOrder = [...aboveStay, ...belowMoved, rowEl, ...aboveMoved, ...belowStay];
  }

  function onUp(ev){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    try{ rowEl.releasePointerCapture(pointerId); }catch(err){}

    // FLIP the settle: capture where every row is actually sitting right
    // now (including the dragged row's tracked-to-the-pointer position),
    // reorder + zero out transforms, then measure where that leaves them
    // and invert the jump into a transform so it can play back out as a
    // transition. Anything looser (e.g. just clearing transforms next to
    // the reorder) risks a one-frame double-counted offset.
    const beforeRects = new Map(siblings.map(el=>[el, el.getBoundingClientRect()]));

    latestOrder.forEach(el=> container.insertBefore(el, afterEl));

    siblings.forEach(el=>{
      el.classList.remove('shift-anim');
      el.style.transition = 'none';
      el.style.transform = '';
    });

    siblings.forEach(el=>{
      const before = beforeRects.get(el);
      const after = el.getBoundingClientRect();
      const dy = before.top - after.top;
      if(Math.abs(dy) > 0.5) el.style.transform = `translateY(${dy}px)`;
    });
    void container.offsetHeight;

    requestAnimationFrame(()=>{
      siblings.forEach(el=>{
        el.style.transition = '';
        el.classList.add('shift-anim');
        el.style.transform = '';
      });
      setTimeout(()=>{
        siblings.forEach(el=>{
          el.classList.remove('shift-anim');
          el.style.transition = '';
        });
        rowEl.classList.remove('dragging');
      }, 170);
    });

    finalizeShopOrder();
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

async function finalizeShopOrder(){
  const box = document.getElementById('shop-list');
  const ids = Array.from(box.querySelectorAll('.shop-item')).map(el=>decodeURIComponent(el.dataset.id));
  shopOrder = ids;
  await saveShopOrder();
}

const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const BACKUP_FILENAME = 'meal-rotation-backup.json';
const BACKUP_REMINDER_DAYS = 30;

let gisReady = false;
let tokenClient = null;

function loadGis(){
  return new Promise((resolve, reject)=>{
    if(gisReady && window.google && window.google.accounts){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = ()=>{ gisReady = true; resolve(); };
    s.onerror = ()=> reject(new Error('gis-load-failed'));
    document.head.appendChild(s);
  });
}

function getAccessToken(){
  return new Promise((resolve, reject)=>{
    if(!tokenClient){
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: ()=>{}
      });
    }
    tokenClient.callback = (resp)=>{
      if(resp.error){ reject(resp); return; }
      resolve(resp.access_token);
    };
    tokenClient.requestAccessToken({ prompt: 'consent' });
  });
}

async function findBackupFileId(token){
  const q = encodeURIComponent(`name='${BACKUP_FILENAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  if(!res.ok) throw new Error('find-failed');
  const data = await res.json();
  return (data.files && data.files[0]) ? data.files[0].id : null;
}

async function downloadBackup(token, fileId){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: 'Bearer ' + token }
  });
  if(!res.ok) throw new Error('download-failed');
  return res.text();
}

// Merges backup meals into local meals by id: new ids are added, and for ids
// present in both, whichever copy has the more recent lastMade wins (so
// restoring doesn't clobber a meal that's been made more recently on this device).
function mergeMeals(local, incoming){
  const byId = new Map(local.map(m=>[m.id, m]));
  let added = 0, updated = 0;
  incoming.forEach(bm=>{
    const lm = byId.get(bm.id);
    if(!lm){
      byId.set(bm.id, bm);
      added++;
    } else {
      const bmTime = bm.lastMade ? new Date(bm.lastMade).getTime() : 0;
      const lmTime = lm.lastMade ? new Date(lm.lastMade).getTime() : 0;
      if(bmTime > lmTime){
        byId.set(bm.id, bm);
        updated++;
      }
    }
  });
  return { merged: Array.from(byId.values()), added, updated };
}

async function uploadBackup(token, jsonContent){
  const fileId = await findBackupFileId(token);
  if(fileId){
    const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: jsonContent
    });
    if(!res.ok) throw new Error('upload-failed');
  } else {
    const boundary = 'mealrotationbackup';
    const metadata = { name: BACKUP_FILENAME, mimeType: 'application/json' };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${jsonContent}\r\n` +
      `--${boundary}--`;
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body
    });
    if(!res.ok) throw new Error('upload-failed');
  }
}

function showToast(message, type){
  const container = document.getElementById('toast-container');
  if(!container) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type||'success');
  el.textContent = message;
  container.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 200);
  }, 4000);
}

window.doBackup = async function(){
  renderBackupMenu('Connecting to Google…');
  try{
    if(GOOGLE_CLIENT_ID.indexOf('YOUR_CLIENT_ID') === 0){
      renderBackupMenu('Not set up yet — add a Google client ID in the code first.');
      showToast('Backup not set up yet — add a Google client ID in the code first.', 'error');
      return;
    }
    await loadGis();
    const token = await getAccessToken();
    renderBackupMenu('Backing up…');
    const content = JSON.stringify({ meals, exportedAt: new Date().toISOString() });
    await uploadBackup(token, content);
    localStorage.setItem(STORAGE_PREFIX+'lastBackup', new Date().toISOString());
    renderBackupMenu('Backed up just now.');
    showToast('Backed up to Google Drive.', 'success');
  }catch(err){
    renderBackupMenu('Backup failed — try again.');
    showToast('Backup to Google Drive failed — try again.', 'error');
  }
}

window.doRestore = async function(){
  renderBackupMenu('Connecting to Google…');
  try{
    if(GOOGLE_CLIENT_ID.indexOf('YOUR_CLIENT_ID') === 0){
      renderBackupMenu('Not set up yet — add a Google client ID in the code first.');
      showToast('Backup not set up yet — add a Google client ID in the code first.', 'error');
      return;
    }
    await loadGis();
    const token = await getAccessToken();
    renderBackupMenu('Restoring…');
    const fileId = await findBackupFileId(token);
    if(!fileId){
      renderBackupMenu('No backup found on Google Drive.');
      showToast('No backup found on Google Drive.', 'error');
      return;
    }
    const content = await downloadBackup(token, fileId);
    const data = JSON.parse(content);
    if(!Array.isArray(data.meals)) throw new Error('invalid-backup');
    const { merged, added, updated } = mergeMeals(meals, data.meals);
    meals = merged;
    await saveMeals();
    renderMeals();
    renderWeek();
    renderShop();
    renderBackupMenu('Restored just now.');
    if(added || updated){
      showToast(`Restored from Google Drive: ${added} added, ${updated} updated.`, 'success');
    } else {
      showToast('Restored from Google Drive — already up to date.', 'success');
    }
  }catch(err){
    renderBackupMenu('Restore failed — try again.');
    showToast('Restore from Google Drive failed — try again.', 'error');
  }
}

function renderBackupMenu(statusOverride){
  const el = document.getElementById('backup-menu-content');
  if(!el) return;
  const last = localStorage.getItem(STORAGE_PREFIX+'lastBackup');
  const ago = daysAgo(last);
  const due = ago===null || ago>=BACKUP_REMINDER_DAYS;
  let pillText;
  if(ago===null) pillText = 'never backed up';
  else if(ago===0) pillText = 'backed up today';
  else pillText = 'backed up ' + ago + 'd ago';
  el.innerHTML = `
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">Back up your meals to Google Drive.</div>
    <span class="pill ${due?'stale':''}" style="margin-bottom:10px;display:inline-block;">${pillText}</span>
    <button class="btn-primary" style="width:100%;" onclick="doBackup()">Back up now</button>
    <button class="btn-ghost" style="margin-top:8px;" onclick="doRestore()">Restore from backup</button>
    ${statusOverride ? `<div style="font-size:12px;color:var(--ink-faint);margin-top:8px;">${statusOverride}</div>` : ''}
  `;
}

let headerMenuOpen = false;

window.toggleHeaderMenu = function(event){
  event.stopPropagation();
  headerMenuOpen = !headerMenuOpen;
  const panel = document.getElementById('header-menu-panel');
  if(panel) panel.classList.toggle('open', headerMenuOpen);
  if(headerMenuOpen) renderBackupMenu();
}

document.addEventListener('click', (e)=>{
  if(headerMenuOpen && !e.target.closest('.header-menu')){
    headerMenuOpen = false;
    const panel = document.getElementById('header-menu-panel');
    if(panel) panel.classList.remove('open');
  }
});

document.getElementById('meal-sort').value = mealSort;
document.getElementById('meal-sort').addEventListener('change', (e)=>{
  mealSort = e.target.value;
  localStorage.setItem('mealRotation.mealSort', mealSort);
  renderMeals();
});

loadAll();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
